# Builds LANDeploy for Linux, Windows and macOS and publishes a GitHub Release.
# A release is made when:
#   - VERSION in server.py changes on main and no tag v<VERSION> exists yet (tag is created for you), or
#   - you push a tag like v1.2.0, or
#   - you run it by hand from the Actions tab.
name: Release

on:
  push:
    branches: [main]
    paths: ["server.py", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Decide whether to release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(python3 -c "import re;print(re.search(r'^VERSION = \"(.+)\"', open('server.py').read(), re.M).group(1))")
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_EVENT_NAME" == workflow_dispatch ]] \
             || [ -z "$(git ls-remote --tags origin "refs/tags/v$v")" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "Releasing v$v"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "v$v already released - bump VERSION in server.py to release again"
          fi

  agents:
    name: Agent ${{ matrix.target }}
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   target: windows-x64 }
          # Linux agents are built on Debian 11 (glibc 2.31) so they also run on older client PCs
          - { os: ubuntu-24.04,     target: linux-x64,   container: "python:3.12-bullseye" }
          - { os: ubuntu-24.04-arm, target: linux-arm64, container: "python:3.12-bullseye" }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"
      - name: Build agent
        run: |
          python -m pip install pyinstaller
          python build.py agent ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.target }}
          path: dist/agent/*
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: [check, agents]
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,   target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: windows-latest, target: windows-x64 }
          - { os: macos-latest,   target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get the client agents (bundled into the app)
        uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: agent/bin
          merge-multiple: true
      - name: Install build tools
        run: python -m pip install pyinstaller pycdlib pillow
      - name: Native window support (Windows/macOS)
        if: runner.os != 'Linux'
        run: python -m pip install pywebview
      - name: Build and smoke-test
        run: python build.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: landeploy-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

  release:
    needs: [check, agents, build]
    # publish whatever built, even if one platform failed or was stuck in the queue
    if: ${{ !cancelled() && needs.check.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: LANDeploy ${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/*
          generate_release_notes: true
          body: |
            ## Downloads — pick one for your computer

            | System | Install it | Portable (no install, data kept next to it) |
            |---|---|---|
            | **Windows 10/11** | `LANDeploy-*-windows-x64-setup.exe` | `LANDeploy-*-windows-x64-portable.zip` |
            | **Ubuntu / Debian** (x64) | `landeploy_*_amd64.deb` | `LANDeploy-*-linux-x64.AppImage` |
            | **Linux ARM64** (Raspberry Pi 5…) | `landeploy_*_arm64.deb` | `LANDeploy-*-linux-arm64.AppImage` |
            | **Mac** (Apple Silicon M1–M4) | `LANDeploy-*-macos-arm64.dmg` | `LANDeploy-*-macos-arm64-portable.zip` |
            | **Mac** (Intel) | `LANDeploy-*-macos-x64.dmg` | `LANDeploy-*-macos-x64-portable.zip` |

            Start **LANDeploy** like any app. It asks for your administrator password once per start, which network boot needs; if you say no, software deployment still works.
            No Python needed, on the server or on client PCs: the `landeploy-agent-*` programs are included in the app and installed on client PCs from its **Agents & tools** page. The apps are not code-signed: Windows SmartScreen → *More info → Run anyway*; Mac → right-click the app → *Open*.
