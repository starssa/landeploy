<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LANDeploy</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#16181d;--mute:#6b7280;--line:#e5e7eb;--acc:#2563eb;--acc2:#dbeafe;--ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;--side:#111827}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--side);color:#cbd5e1;padding:18px 12px;display:flex;flex-direction:column;gap:2px}
nav .logo{color:#fff;font-weight:700;font-size:18px;padding:4px 10px 18px;letter-spacing:.2px}
nav .logo span{color:#60a5fa}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;display:flex;gap:10px;align-items:center}
nav button:hover{background:#1f2937}nav button.on{background:#1e3a8a;color:#fff}
nav .grp{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#64748b;padding:16px 12px 4px}
nav .grp:empty{padding:8px 0 0;border-bottom:1px solid #1f2937;margin:0 10px 6px}
nav .foot{margin-top:auto;font-size:12px;color:#64748b;padding:10px}
main{padding:26px 32px;max-width:1200px;width:100%}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:22px 0 10px}.sub{color:var(--mute);margin:0 0 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
a.card.link{text-decoration:none;color:inherit;display:block}a.card.link:hover{border-color:#93c5fd}
.card .n{font-size:28px;font-weight:700}.card .l{color:var(--mute)}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);background:#fafafa}
tr:last-child td{border-bottom:none}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
a.btn{text-decoration:none;color:inherit;display:inline-block}a.btn.p{color:#fff}
.btn:hover{border-color:#cbd5e1}.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}.btn.p:hover{filter:brightness(1.08)}
.btn.d{color:var(--bad)}.btn.s{padding:4px 9px;font-size:13px}.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#eef2f7;color:#334155;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.acc{background:var(--acc2);color:var(--acc)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.muted{color:var(--mute)}.empty{padding:28px;text-align:center;color:var(--mute)}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
textarea{font-family:ui-monospace,monospace;font-size:12.5px;min-height:180px}
label{display:block;font-weight:600;margin:12px 0 5px}label small{font-weight:400;color:var(--mute)}
.check{display:flex;gap:8px;align-items:center;font-weight:400}.check input{width:auto}
.steps{display:flex;gap:6px;margin-bottom:18px}.steps div{flex:1;height:4px;border-radius:4px;background:var(--line)}.steps div.on{background:var(--acc)}
.choice{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;margin-bottom:8px;display:flex;gap:12px;align-items:center}
.choice:hover{border-color:#93c5fd}.choice.on{border-color:var(--acc);background:#f5f9ff}.choice b{display:block}
dialog{border:none;border-radius:14px;padding:0;width:min(620px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(15,23,42,.45)}
.dlg{padding:22px 24px}.dlg h3{margin:0 0 4px;font-size:18px}.dlg .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.check-list li{margin:6px 0}.drop{border:2px dashed #cbd5e1;border-radius:12px;padding:22px;text-align:center;color:var(--mute);cursor:pointer;background:#fff}
.drop.hov{border-color:var(--acc);background:#f5f9ff}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
.bar i.indet{width:40%;animation:indet 1.2s infinite ease-in-out}@keyframes indet{0%{margin-left:-40%}100%{margin-left:100%}}
.toast{position:fixed;bottom:20px;right:20px;background:#111827;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none}.toast.on{opacity:1}
pre{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:10px;overflow:auto;font-size:12.5px}
.cmd{display:flex;gap:8px;align-items:stretch;margin:6px 0 4px}.cmd code{flex:1;background:#0f172a;color:#e2e8f0;padding:10px 12px;border-radius:8px;font:12.5px ui-monospace,monospace;word-break:break-all}
.cmd .btn{white-space:nowrap}.tool{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.tool:last-child{border:none}.tool .ic{font-size:26px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font:inherit}.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:800px){.app{grid-template-columns:1fr}nav{flex-direction:row;overflow:auto}nav .logo,nav .foot,nav .grp{display:none}main{padding:16px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<nav>
  <div class="logo">LAN<span>Deploy</span></div>
  <button data-v="home" class="on">🏠 Overview</button>
  <button data-v="pcs">💻 Computers</button>
  <div class="grp">OS install</div>
  <button data-v="os">💿 OS library</button>
  <button data-v="win">🪟 Windows install config</button>
  <button data-v="post">🧩 Post-install</button>
  <button data-v="ipxe">🥾 iPXE network boot</button>
  <div class="grp">Software install</div>
  <button data-v="sw">📦 Packages</button>
  <button data-v="agent">🤖 Install the agent</button>
  <button data-v="gen">🧪 Command generator</button>
  <div class="grp"></div>
  <button data-v="log">🕘 Activity</button>
  <button data-v="set">⚙️ Settings</button>
  <div class="foot" id="srv"></div>
</nav>
<main id="view"></main>
</div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let S = null, view = 'home';
const SEL = new Set();   // selected rows on the Computers page: "m:<mac>" or "a:<agent id>"
const selMacs = () => [...SEL].filter(k=>k[0]==='m').map(k=>k.slice(2));
const selAgents = () => { const ids = new Set();
  [...SEL].forEach(k => { if(k[0]==='a') ids.add(k.slice(2)); else Object.values(S.agents).forEach(a => { if(a.macs.includes(k.slice(2))) ids.add(a.id); }); });
  return [...ids]; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago = t => { if(!t) return '—'; const d = Date.now()/1000 - t; return d<60?'just now':d<3600?Math.floor(d/60)+' min ago':d<86400?Math.floor(d/3600)+' h ago':new Date(t*1000).toLocaleDateString(); };
const size = b => b>1e9?(b/1e9).toFixed(1)+' GB':b>1e6?(b/1e6).toFixed(0)+' MB':b>1e3?(b/1e3).toFixed(0)+' KB':(b||0)+' B';
const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600); };
async function api(path, body){ const r = await fetch(path, body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); const j = await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||r.statusText); return j; }
const STATUS = {booting:['🟣','Network-booting','#7c3aed','#ede9fe'], installing:['🔵','Installing','#1d4ed8','#dbeafe'],
                on:['🟢','On','#15803d','#dcfce7'], off:['⚫','Off','#475569','#f1f5f9']};
const statusPill = st => { const [i,l,c,bg] = STATUS[st] || STATUS.off; return `<span class="pill" style="background:${bg};color:${c};font-weight:600">${i} ${l}</span>`; };
let lastEventT = null;
function bootNotices(){                     // pop-up when a PC starts network-booting
  const newest = S.events.length ? S.events[0].t : 0;
  if(lastEventT !== null) S.events.filter(e=>e.t>lastEventT && e.k==='boot').reverse().forEach((e,i)=>setTimeout(()=>toast('🟣 '+e.msg), i*2700));
  lastEventT = Math.max(lastEventT||0, newest);
}
async function load(){ S = await api('/api/state'); bootNotices(); $('#srv').innerHTML = `Server<br><b class="mono" style="color:#e2e8f0">${esc(S.server.base)}</b><br>v${esc(S.server.version)}`; render(); }
const TYPES = {windows:'Windows',arch:'Arch Linux',ubuntu:'Ubuntu',fedora:'Fedora/RHEL','debian-live':'Debian live',generic:'Raw ISO'};
const online = a => Date.now()/1000 - a.last_seen < 90;

document.querySelectorAll('nav button').forEach(b => b.onclick = () => { view=b.dataset.v; document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b)); render(); });

function render(){ $('#view').innerHTML = ({home, pcs, os, win, post, ipxe, sw, agent, gen, log, set})[view](); bind(); }
const go = v => document.querySelector(`nav [data-v=${v}]`).click();

/* copy that also works on plain http:// LAN addresses (navigator.clipboard needs https) */
function copyText(t){
  const done = () => toast('Copied to clipboard');
  const legacy = () => { const ta = document.createElement('textarea'); ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); let ok=false; try{ ok = document.execCommand('copy'); }catch(e){} ta.remove(); ok ? done() : prompt('Copy this:', t); };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, legacy); else legacy();
}
const cmdBox = (text, label) => `<div class="cmd"><code>${esc(text)}</code><button class="btn" data-copy="${esc(text)}">📋 ${label||'Copy'}</button></div>`;
let osTab = 'win';
const GEN = {type:'winget', id:'', silent:true, accept:true, machine:false, peruser:false};

/* ---------------------------------------------------------------- views */
function home(){
  const L = Object.values(S.library), ready = L.filter(e=>e.status==='ready');
  const ag = Object.values(S.agents), on = ag.filter(online);
  const bf = S.server.bootfiles, needBf = ['undionly.kpxe','wimboot'].filter(f=>!bf.includes(f)).concat(bf.includes('snponly.efi')||bf.includes('ipxe.efi')?[]:['snponly.efi']);
  const hasWin = ready.some(e=>e.boot.type==='windows');
  const step = (ok, txt) => `<li>${ok?'✅':'⬜'} ${txt}</li>`;
  const px = S.server.pxe || {}, pxeOff = !S.server.pxe_enabled || !Object.values(px).every(Boolean);
  return `<h1>Overview</h1><p class="sub">Network-boot any PC into an OS installer, and push software to PCs that run the agent.</p>
  ${pxeOff?`<div class="card" style="border-color:#fcd34d;background:#fffbeb;margin-bottom:14px">⚠️ <b>Network boot (OS install) is off.</b>
    PCs can't install an OS until it's on — <a href="#" data-go="ipxe">see why</a>. Software deployment works normally.</div>`:''}
  <div class="cards">
    <a class="card link" href="#" data-go="os"><div class="n">${ready.length}</div><div class="l">OS images ready</div></a>
    <a class="card link" href="#" data-go="pcs"><div class="n">${Object.keys(S.machines).length}</div><div class="l">Computers</div></a>
    <a class="card link" href="#" data-go="pcs"><div class="n">${Object.keys(S.assignments).length}</div><div class="l">OS installs scheduled</div></a>
    <a class="card link" href="#" data-go="agent"><div class="n">${on.length}<span class="muted" style="font-size:16px"> / ${ag.length}</span></div><div class="l">Agents online</div></a>
  </div>
  <h2>Setup checklist</h2>
  <div class="card"><ul class="check-list" style="list-style:none;padding:0;margin:0">
    ${step(!needBf.length, needBf.length?'Download the network boot files — <a href="#" data-go="ipxe">iPXE network boot</a>':'Network boot files ready')}
    ${step(L.length, 'Add your ISO files — <a href="#" data-go="os">OS library</a>')}
    ${hasWin?step(null, 'Windows ISOs: share the data folder — <a href="#" data-go="ipxe">see iPXE network boot</a>'):''}
    ${step(ag.length, 'Install the agent on PCs to push software — <a href="#" data-go="agent">Install the agent</a>')}
    ${step(Object.keys(S.machines).length, 'Network-boot a PC (F12 → Network / PXE): it appears in <a href="#" data-go="pcs">Computers</a>')}
  </ul></div>
  <h2>Recent activity</h2>${events(5)}`;
}
function events(n){ const E=S.events.slice(0,n); return E.length?`<table>${E.map(e=>`<tr><td class="muted" style="width:130px">${ago(e.t)}</td><td>${esc(e.msg)}</td></tr>`).join('')}</table>`:'<div class="card empty">Nothing yet.</div>'; }

function pcs(){
  const rows = Object.values(S.machines).sort((a,b)=>b.last_seen-a.last_seen);
  const agentByMac = {}; Object.values(S.agents).forEach(a=>a.macs.forEach(m=>agentByMac[m]=a));
  const extra = Object.values(S.agents).filter(a=>!a.macs.some(m=>S.machines[m]));
  const tr = (m, a) => { const as = m && S.assignments[m.mac], e = as && S.library[as.entry_id];
    const key = m ? 'm:'+m.mac : 'a:'+a.id;
    const stt = m ? m.status : a.status;
    return `<tr><td style="width:32px"><input type="checkbox" class="sel" data-key="${key}" ${SEL.has(key)?'checked':''}></td><td style="width:150px">${statusPill(stt)}</td><td><b>${esc(m?.name || a?.hostname || 'Unnamed PC')}</b>${m?` <a href="#" class="muted" data-act="rename" data-mac="${m.mac}" title="Rename">✎</a>`:''}
      <div class="muted"><span class="mono">${esc(m?.mac || a.macs[0] || '')}</span> · ${a ? (online(a)?'agent online':'agent offline') : 'no agent'}</div></td>
    <td>${m ? esc([m.manufacturer, m.product].filter(Boolean).join(' ') || '—') : '—'}<div class="muted">${esc(a? a.os : (m.platform||m.arch||''))}</div></td>
    <td>${e ? `<span class="pill acc">${as.mode==='auto'?'Auto':'Ask'}: ${esc(e.name)}</span> <a href="#" class="muted" data-act="unassign" data-mac="${m.mac}" title="Cancel this install">✕</a>` : m?.state==='installing' ? `<span class="pill warn">Installing ${esc(m.last_deploy)}</span>` : '<span class="muted">—</span>'}</td>
    <td><div class="row" style="justify-content:flex-end;flex-wrap:nowrap">${m?`<button class="btn s p" data-act="osw" data-mac="${m.mac}">Deploy OS</button>`:''}
      ${a?`<button class="btn s" data-act="sww" data-agent="${a.id}">Software</button>`:''}
      ${m?`<button class="btn s" data-act="wol" data-mac="${m.mac}" title="Wake-on-LAN (power on)">⏻</button>`:''}
      <button class="btn s" data-act="rmpc" data-key="${key}" title="Remove from the list">🗑</button></div></td></tr>`; };
  const body = rows.map(m=>tr(m, agentByMac[m.mac])).concat(extra.map(a=>tr(null,a))).join('');
  const counts = {}; rows.forEach(m=>counts[m.status]=(counts[m.status]||0)+1); extra.forEach(a=>counts[a.status]=(counts[a.status]||0)+1);
  const chips = Object.keys(STATUS).filter(k=>counts[k]).map(k=>`${statusPill(k)} <b style="margin-right:10px">${counts[k]}</b>`).join('');
  return `<div class="row"><div><h1>Computers</h1><p class="sub">PCs appear here after their first network boot, or when the agent registers. Tick several to act on them together.</p></div><div class="sp"></div>
    <button class="btn" data-act="addpc">+ Add by MAC</button></div>
    ${chips?`<div class="row" style="margin-bottom:12px">${chips}<span class="muted" title="On = the agent reports, the PC answers ping, or it just asked the network for an address">ⓘ</span></div>`:''}
    <div class="card row" id="bulk" style="margin-bottom:12px;${SEL.size?'':'display:none'}"><b id="bulkn">${SEL.size} selected</b><div class="sp"></div>
      <button class="btn p" data-act="bulkos">Deploy OS</button><button class="btn" data-act="bulksw">Install software</button>
      <button class="btn" data-act="bulkwol">⏻ Wake</button><button class="btn d" data-act="bulkrm">🗑 Remove</button><button class="btn" data-act="bulkclear">Clear</button></div>
    ${body?`<table><tr><th><input type="checkbox" id="selall"></th><th>Status</th><th>Computer</th><th>Hardware / OS</th><th>Scheduled</th><th></th></tr>${body}</table>`:'<div class="card empty">No computers yet. Boot a PC from the network (usually F12 → "PXE / Network boot"), or install the agent.</div>'}`;
}

function os(){
  const L = Object.values(S.library).sort((a,b)=>a.name.localeCompare(b.name));
  const st = e => e.status==='ready'?`<span class="pill ok">ready</span> ${e.mode==='mount'?'<span class="pill acc" title="Mounted from the ISO, no copy on disk">mounted</span>':'<span class="pill" title="Files copied to disk">extracted</span>'}`:e.status.startsWith('error')?`<span class="pill bad" title="${esc(e.status)}">error</span>`:`<span class="pill warn">${esc(e.status)}…</span>`;
  return `<h1>OS library</h1><p class="sub">Official or custom ISOs. You can also copy them into <span class="mono">${esc(S.server.data_dir)}/isos</span> and click Rescan.</p>
  <div class="drop" id="dropIso">⬆️ <b>Drop ISO files here</b> or click to choose<div class="bar" hidden><i></i></div><input type="file" accept=".iso" multiple hidden></div>
  <div class="row" style="margin:14px 0"><span class="muted">New ISOs are</span>
    <select id="isomode" style="width:auto"><option value="mount" ${S.settings.iso_mode!=='extract'?'selected':''}>mounted — no copy, no extra disk space</option><option value="extract" ${S.settings.iso_mode==='extract'?'selected':''}>extracted — files copied to disk</option></select>
    <div class="sp"></div><button class="btn" data-act="rescan">↻ Rescan folder</button></div>
  ${L.length?`<table><tr><th>Name</th><th>Type</th><th>Size</th><th>Status</th><th></th></tr>${L.map(e=>`<tr>
    <td><b>${esc(e.name)}</b><div class="muted mono">${esc(e.iso)}</div></td>
    <td>${e.boot?.type?`<span class="pill">${TYPES[e.boot.type]}</span>`:'—'}</td><td>${size(e.size)}</td><td>${st(e)} ${e.enabled?'':'<span class="pill">hidden</span>'}</td>
    <td><div class="row"><button class="btn s" data-act="edit" data-id="${e.id}">Options</button><button class="btn s" data-act="prep" data-id="${e.id}" title="Prepare again (e.g. after replacing the ISO file)">↻ Refresh</button><button class="btn s d" data-act="del" data-id="${e.id}">Delete</button></div></td></tr>`).join('')}</table>`:'<div class="card empty">No ISOs yet.</div>'}
  <details style="margin-top:18px"><summary class="muted">Which ISOs work?</summary><div class="card muted" style="margin-top:8px">
  <b>Windows 10/11</b>: boots the ISO's WinPE with wimboot, then runs Setup from the SMB share (optionally unattended). ·
  <b>Ubuntu</b>: live/installer over HTTP, optional autoinstall. · <b>Fedora/RHEL/Alma/Rocky</b>: live or Anaconda (inst.repo), optional kickstart. ·
  <b>Arch Linux</b>, <b>Debian live</b>: over HTTP. · <b>Anything else</b>: raw ISO via iPXE sanboot (best on BIOS, small ISOs).</div></details>`;
}

function sw(){
  const P = Object.values(S.packages).filter(p=>!p.hidden), J = Object.values(S.jobs).sort((a,b)=>b.created-a.created).slice(0,30);
  const cls = {success:'ok',failed:'bad',denied:'bad',cancelled:'',pending:'acc',asking:'warn',running:'warn'};
  const jobBar = j => { const p = typeof j.percent==='number'?j.percent:-1; const ph = esc(j.phase||'Working');
    return `<div style="margin-top:4px"><div class="muted" style="font-size:12px">${ph}${p>=0?' · '+p+'%':''}</div>
      <div class="bar" style="max-width:260px">${p>=0?`<i style="width:${p}%"></i>`:`<i class="indet"></i>`}</div></div>`; };
  return `<div class="row"><div><h1>Packages</h1><p class="sub">Software to push to PCs that run the agent. By default the user is asked first. Build commands with the <a href="#" data-go="gen">Command generator</a>.</p></div><div class="sp"></div><button class="btn p" data-act="newpkg">+ New package</button></div>
  ${P.length?`<table><tr><th>Package</th><th>Installer</th><th>Consent</th><th></th></tr>${P.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="muted">${esc(p.os||'any')}</div></td>
    <td class="mono">${p.command?esc(p.command):p.file?esc(p.file)+' '+esc(p.args||'')+` <span class="muted">(${size(p.size)})</span>`:'<span class="pill bad">no file</span>'}</td>
    <td>${p.consent===false?'<span class="pill warn">silent</span>':'<span class="pill ok">asks user</span>'} ${p.run_as==='user'?'<span class="pill acc">per-user</span>':''}</td>

function ipxe(){
  const T = S.tools, x = T.bootfiles, px = S.server.pxe || {};
  const on = S.server.pxe_enabled && Object.values(px).length && Object.values(px).every(Boolean);
  const stat = x.state==='running' ? `<span class="pill warn">⏳ ${esc(x.msg)}</span>` : x.state==='error' ? `<span class="pill bad">${esc(x.msg).slice(0,120)}</span>` : x.present ? '<span class="pill ok">✓ ready</span>' : '<span class="pill warn">missing</span>';
  const hasWin = Object.values(S.library).some(e=>e.boot?.type==='windows');
  return `<h1>iPXE network boot</h1><p class="sub">What client PCs need to start an OS installer from the network.</p>
  <div class="card">
    <div class="tool"><div class="ic">${on?'🟢':'🔴'}</div><div class="sp"><b>Network boot service</b> ${on?'<span class="pill ok">on</span>':'<span class="pill bad">off</span>'}
      <div class="muted">${on ? `Answering PCs that network-boot, on ports 67 · 69 · 4011 (server ${esc(S.server.ip)}).`
        : S.server.pxe_enabled ? 'Could not open ports 67/69. Close LANDeploy and start it again, accepting the administrator prompt — or another DHCP/TFTP server runs on this PC.'
        : 'LANDeploy was started without network boot.'}</div></div></div>
    <div class="tool"><div class="ic">🥾</div><div class="sp"><b>iPXE boot files</b> ${stat}
      <div class="muted">Small programs sent to each PC when it network-boots (BIOS, UEFI and Windows). Downloaded once.${x.missing.length?` Missing: <span class="mono">${x.missing.join(', ')}</span>`:''}</div></div>
      <button class="btn ${x.present?'':'p'}" data-act="fetchtool" data-what="bootfiles" ${x.state==='running'?'disabled':''}>${x.present?'↻ Update':'⬇ Download'}</button></div>
    ${hasWin?`<div class="tool"><div class="ic">📁</div><div class="sp"><b>Shared folder for Windows ISOs</b>
      <div class="muted">Windows Setup reads its files from this server over SMB: set up the share once.</div></div>
      <button class="btn" data-act="smb">Show setup</button></div>
    <div class="tool"><div class="ic">🔌</div><div class="sp"><b>Network drivers for the Windows installer</b> ${S.winpe_drivers.length?`<span class="pill ok">${S.winpe_drivers.filter(f=>/\.inf$/i.test(f)).length} driver(s)</span>`:'<span class="pill">none</span>'}
      <div class="muted">Only if a PC stops at <i>"No connection to the LANDeploy server"</i> with no IPv4 address: the Windows installer lacks a driver for its network card.
        Add that card's driver files (<span class="mono">.inf .sys .cat</span>, from the PC maker's or Intel/Realtek's site, Windows 10/11 x64).</div>
      ${S.winpe_drivers.length?`<div class="mono muted" style="margin-top:4px">${S.winpe_drivers.map(esc).join(' · ')}</div>`:''}</div>
      <div class="row" style="flex-wrap:nowrap"><button class="btn" data-act="addwdrv">+ Add files</button>${S.winpe_drivers.length?'<button class="btn s d" data-act="clrwdrv" title="Remove all">🗑</button>':''}</div></div>`:''}
  </div>
  <details style="margin-top:18px"><summary class="muted">A PC stays on "DHCP…" or says "No boot filename"?</summary><div class="card muted" style="margin-top:8px">
    The PC and this server must be on the <b>same wired network</b>, with a router that gives out IP addresses (LANDeploy doesn't).
    The server's firewall must allow UDP 67, 69 and 4011. In BIOS/UEFI, enable network boot and turn off Secure Boot on the client.</div></details>`;
}

    <label>Command</label>${g ? cmdBox(g) : '<div class="muted">Type an ID above.</div>'}
    ${g && GEN.type!=='switch' ? `<div class="row"><button class="btn p" data-act="genpkg">📦 Create package</button></div>`:''}
    ${GEN.type==='switch'?'<p class="muted">Paste these into a package\'s "Silent switches" field.</p>':''}
  </div>`;
}
function genCommand(){
  const id = (GEN.id||'').trim(); if(!id) return '';
  switch(GEN.type){
    case 'winget': return `winget install -e --id ${id}` + (GEN.silent?' --silent':'') + (GEN.accept?' --accept-package-agreements --accept-source-agreements':'') + (GEN.machine?' --scope machine':'');
    case 'apt': return `apt-get install -y ${id}`;
    case 'snap': return `snap install ${id}`;
    case 'flatpak': return `flatpak install -y --noninteractive flathub ${id}`;
    case 'switch': return PRESETS[id] || '';
  }
}

function sfx(kind, i){ if(kind==='number') return String(i+1); if(kind==='number2') return String(i+1).padStart(2,'0');
  if(kind==='letter'||kind==='LETTER'){ let s='', n=i; do{ s=String.fromCharCode(97+n%26)+s; n=Math.floor(n/26)-1; }while(n>=0); return kind==='letter'?s:s.toUpperCase(); } return ''; }

/* ---------------------------------------------------------------- dialogs */
function dlg(html){ $('#dlgBody').innerHTML = html; const d=$('#dlg'); if(!d.open) d.showModal(); return d; }
function closeDlg(){ $('#dlg').close(); }

const MACRE = /^([0-9a-f]{2}:){5}[0-9a-f]{2}$/;
const pcLabel = macs => macs.length===1 ? (S.machines[macs[0]]?.name || macs[0]) : `${macs.length} computers`;
function osWizard(macs){
  const ready = Object.values(S.library).filter(e=>e.status==='ready');
  if(!ready.length) return toast('Add an ISO to the OS library first');
  const w = {step:1, macs:new Set(macs||[]), entry:null, mode:'confirm', wake:true};
  const draw = () => {
    const bar = `<div class="steps">${[1,2,3].map(i=>`<div class="${i<=w.step?'on':''}"></div>`).join('')}</div>`;
    let body = '';
    if(w.step===1){
      const pcsList = Object.values(S.machines);
      const typed = [...w.macs].filter(m=>!S.machines[m]).join('\n');
      body = `<h3>Which computers?</h3><p class="muted">Tick as many as you want — they will all install in parallel.</p>
       ${pcsList.length?`<div class="row" style="margin-bottom:6px"><button class="btn s" id="wall">Select all</button><button class="btn s" id="wnone">None</button></div>`:''}
       <div style="max-height:260px;overflow:auto">${pcsList.map(m=>`<label class="choice ${w.macs.has(m.mac)?'on':''}"><input type="checkbox" style="width:auto" data-wmac="${m.mac}" ${w.macs.has(m.mac)?'checked':''}><div><b>${esc(m.name||m.product||'Unnamed PC')}</b><span class="muted mono">${m.mac}</span></div></label>`).join('')}</div>
       <label>Other MAC addresses <small>(one per line — e.g. PCs that never booted from network yet)</small></label><textarea id="wmacs" class="mono" style="min-height:70px" placeholder="aa:bb:cc:dd:ee:ff">${esc(typed)}</textarea>`;
    } else if(w.step===2){
      body = `<h3>Which operating system?</h3><p class="muted">For ${esc(pcLabel([...w.macs]))}</p>
       ${ready.map(e=>`<div class="choice ${w.entry===e.id?'on':''}" data-entry="${e.id}">💿<div><b>${esc(e.name)}</b><span class="muted">${TYPES[e.boot.type]}${e.unattend||e.autoinstall||e.kickstart?' · unattended answers set':''}</span></div></div>`).join('')}`;
    } else {
      const e = S.library[w.entry];
      body = `<h3>How should it start?</h3><p class="muted">${esc(e.name)} → ${esc(pcLabel([...w.macs]))}. Applies to each PC's <b>next</b> network boot only.</p>
       ${w.macs.size>1?`<p class="muted">💡 For many PCs at once: choose <b>Start automatically</b> + Wake-on-LAN, and use unattended answers (OS library → Options) so nobody has to click through each installer.</p>`:''}
       <div class="choice ${w.mode==='confirm'?'on':''}" data-mode="confirm">🙋<div><b>Ask on the PC's screen</b><span class="muted">The PC shows "Press Y to install". Safest.</span></div></div>
       <div class="choice ${w.mode==='auto'?'on':''}" data-mode="auto">⚡<div><b>Start automatically</b><span class="muted">Installer starts after a countdown of ${S.settings.auto_delay} s (any key cancels).</span></div></div>
       <label class="check"><input type="checkbox" id="wwake" ${w.wake?'checked':''}> Send Wake-on-LAN now</label>
       <p class="muted" style="margin-top:14px">The PC must be set to boot from network first (BIOS/UEFI boot order, or F12 menu). ${e.boot.type==='windows'?'Windows needs the SMB share (Overview → checklist).':''}</p>`;
    }
    dlg(`${bar}${body}<div class="foot"><button class="btn" id="wback">${w.step===1?'Cancel':'Back'}</button><button class="btn p" id="wnext">${w.step===3?'Schedule install':'Next'}</button></div>`);
    const readTyped = () => { const t=$('#wmacs'); if(!t) return true;
      const list = t.value.split(/[\s,;]+/).map(x=>x.trim().toLowerCase().replace(/-/g,':')).filter(Boolean);
      const bad = list.filter(x=>!MACRE.test(x)); if(bad.length){ toast('Invalid MAC: '+bad[0]); return false; }
      [...w.macs].filter(m=>!S.machines[m]).forEach(m=>w.macs.delete(m)); list.forEach(m=>w.macs.add(m)); return true; };
    document.querySelectorAll('#dlgBody [data-wmac]').forEach(c=>c.onchange=()=>{ readTyped(); c.checked?w.macs.add(c.dataset.wmac):w.macs.delete(c.dataset.wmac); draw(); });
    if($('#wall')){ $('#wall').onclick=()=>{ readTyped(); Object.keys(S.machines).forEach(m=>w.macs.add(m)); draw(); }; $('#wnone').onclick=()=>{ w.macs.clear(); draw(); }; }
    document.querySelectorAll('#dlgBody .choice[data-entry],#dlgBody .choice[data-mode]').forEach(c=>c.onclick=()=>{ if(c.dataset.entry) w.entry=c.dataset.entry; if(c.dataset.mode) w.mode=c.dataset.mode; draw(); });
    $('#wback').onclick = () => { if(w.step===1) return closeDlg(); w.step--; draw(); };
    $('#wnext').onclick = async () => {
      if(w.step===1){ if(!readTyped()) return; if(!w.macs.size) return toast('Select at least one computer'); }
      if(w.step===2 && !w.entry) return toast('Choose an OS');
      if(w.step===3){ w.wake = $('#wwake').checked; try{ const r = await api('/api/assign',{macs:[...w.macs], entry_id:w.entry, mode:w.mode, wake:w.wake}); closeDlg(); SEL.clear(); toast(`Scheduled on ${r.count} computer(s) — network-boot them now`); load(); }catch(err){ toast(err.message); } return; }
      w.step++; draw();
    };
  };
  draw();
}

function swWizard(pkgId, agentIds){
  const P = Object.values(S.packages).filter(p=>!p.hidden && (p.file||p.command)), A = Object.values(S.agents);
  if(!P.length) return toast('Create a package first'); if(!A.length){ toast('No agent yet: install it on the PCs first'); return go('agent'); }
  const w = {pkg:pkgId||null, agents:new Set(agentIds||[])};
  const draw = () => dlg(`<h3>Install software</h3><p class="muted">All selected PCs receive the job within ~20 s and install in parallel.</p>
    <label>Package</label>${P.map(p=>`<div class="choice ${w.pkg===p.id?'on':''}" data-pkg="${p.id}">📦<div><b>${esc(p.name)}</b><span class="muted">${p.consent===false?'silent install':'user will be asked to allow it'}</span></div></div>`).join('')}
    <label>Computers <a href="#" id="wsall">select all</a> · <a href="#" id="wson">all online</a></label><div style="max-height:220px;overflow:auto">${A.map(a=>`<label class="check"><input type="checkbox" data-agent="${a.id}" ${w.agents.has(a.id)?'checked':''}> ${esc(a.hostname)} <span class="muted">${esc(a.os)} · ${online(a)?'online':'offline'}</span></label>`).join('')}</div>
    <div class="foot"><button class="btn" id="wback">Cancel</button><button class="btn p" id="wgo">Deploy</button></div>`);
  const wire = () => {
    document.querySelectorAll('#dlgBody .choice').forEach(c=>c.onclick=()=>{ w.pkg=c.dataset.pkg; draw(); wire(); });
    document.querySelectorAll('#dlgBody [data-agent]').forEach(c=>c.onchange=()=>{ c.checked?w.agents.add(c.dataset.agent):w.agents.delete(c.dataset.agent); });
    $('#wsall').onclick = e => { e.preventDefault(); A.forEach(a=>w.agents.add(a.id)); draw(); wire(); };
    $('#wson').onclick = e => { e.preventDefault(); w.agents = new Set(A.filter(online).map(a=>a.id)); draw(); wire(); };
    $('#wback').onclick = closeDlg;
    $('#wgo').onclick = async () => { if(!w.pkg||!w.agents.size) return toast('Pick a package and at least one PC');
      const r = await api('/api/deploy',{package_id:w.pkg, agent_ids:[...w.agents]}); closeDlg(); toast(`${r.jobs.length} job(s) queued`); view='sw'; document.querySelector('nav [data-v=sw]').click(); };
  };
  draw(); wire();
}

const PRESETS = {'': '', 'MSI (silent)':'/qn /norestart', 'NSIS (/S)':'/S', 'Inno Setup':'/VERYSILENT /NORESTART /SUPPRESSMSGBOXES', 'InstallShield':'/s /v"/qn"', 'MS Office (zip, Click-to-Run)':'setup.exe /configure configuration.xml', 'MS Office (.img from Microsoft)':'setup.exe', 'Folder zip: run setup.exe':'setup.exe'};
function pkgDialog(id){
  const p = S.packages[id] || {name:'', os:'windows', args:'', command:'', consent:true};
  dlg(`<h3>${id?'Edit':'New'} package</h3>
   <label>Name</label><input id="pname" value="${esc(p.name)}" placeholder="e.g. 7-Zip 24">
   <label>Target OS</label><select id="pos">${['windows','linux','any'].map(o=>`<option ${p.os===o?'selected':''}>${o}</option>`).join('')}</select>
   <label>Installer file <small>(.msi .exe .ps1 .deb .rpm .sh .AppImage — a <b>.zip of a whole folder</b> — or a disk image <b>.img / .iso</b>, e.g. Microsoft's Office .img)</small> ${p.file?`<span class="muted mono">current: ${esc(p.file)}</span>`:''}</label><input type="file" id="pfile">
   <div class="grid2"><div><label>Silent switches <small>(for a .zip / .img / .iso: the command to run inside it)</small></label><input id="pargs" class="mono" value="${esc(p.args)}"></div>
   <div><label>Preset</label><select id="ppreset">${Object.keys(PRESETS).map(k=>`<option value="${k}">${k||'—'}</option>`).join('')}</select></div></div>
   <label>…or a command instead of a file <small>e.g. <span class="mono">winget install -e --id 7zip.7zip --silent</span> or <span class="mono">apt-get install -y vlc</span></small></label><input id="pcmd" class="mono" value="${esc(p.command)}">
   <label class="check" style="margin-top:14px"><input type="checkbox" id="pconsent" ${p.consent!==false?'checked':''}> Ask the user for permission before installing</label>
   <label class="check"><input type="checkbox" id="puser" ${p.run_as==='user'?'checked':''}> Per-user app: install into the <b>logged-in user's</b> account</label>
   <div class="muted" style="margin-left:24px">Tick for apps that install per user (Antigravity IDE, VS Code user setup, Cursor, Discord, Zoom…). Untick for normal machine-wide installers (MSI, Office, 7-Zip…).</div>
   <div class="bar" hidden id="pbar"><i></i></div>
   <div class="foot"><button class="btn" onclick="closeDlg()">Cancel</button><button class="btn p" id="psave">Save</button></div>`);
  $('#ppreset').onchange = e => { if(e.target.value) $('#pargs').value = PRESETS[e.target.value]; };
  $('#psave').onclick = async () => {
    const name = $('#pname').value.trim(); if(!name) return toast('Name required');
    const f = $('#pfile').files[0];
    if(!f && !$('#pcmd').value.trim() && !p.file) return toast('Choose an installer file or enter a command');
    const r = await api('/api/packages',{id, name, os:$('#pos').value, args:$('#pargs').value, command:$('#pcmd').value.trim(), consent:$('#pconsent').checked, run_as:$('#puser').checked?'user':'system'});
    if(f){ $('#pbar').hidden=false; await upload(`/api/upload?kind=package&id=${r.id}&name=${encodeURIComponent(f.name)}`, f, $('#pbar i')); }
    closeDlg(); toast('Package saved'); load();
  };
}

function editEntry(id){
  const e = S.library[id], t = e.boot.type;
  const field = t==='windows'?['unattend','Custom autounattend.xml',WIN_TPL]:t==='ubuntu'?['autoinstall','cloud-init autoinstall user-data (optional)',UBU_TPL]:t==='fedora'&&!e.boot.live?['kickstart','Kickstart file (optional)',KS_TPL]:null;
  dlg(`<h3>${esc(e.name)}</h3><p class="muted">${TYPES[t]||'?'} · <span class="mono">${esc(e.iso)}</span></p>
   <label>Display name</label><input id="ename" value="${esc(e.name)}">
   <label>Storage</label><select id="emode"><option value="mount" ${e.mode==='mount'?'selected':''}>Mounted: read straight from the ISO (no copy)</option><option value="extract" ${e.mode!=='mount'?'selected':''}>Extracted: files copied to disk</option></select>
   <label class="check"><input type="checkbox" id="eon" ${e.enabled?'checked':''}> Show in the network boot menu</label>
   ${t!=='windows'&&t!=='generic'?`<label>Extra kernel arguments</label><input id="eargs" class="mono" value="${esc(e.extra_args)}" placeholder="e.g. quiet splash">`:''}
   ${t==='windows'?`<label>Answer file</label><select id="eanswer"><option value="profile" ${(e.answer||(e.unattend?'custom':'profile'))==='profile'?'selected':''}>Windows setup page (shared by all Windows ISOs)</option><option value="custom" ${(e.answer||(e.unattend?'custom':''))==='custom'?'selected':''}>Custom XML below</option><option value="none" ${e.answer==='none'?'selected':''}>None: answer everything at the PC</option></select>`:''}
   ${field?`<label>${field[1]} <a href="#" id="etpl">insert template</a></label><textarea id="eans">${esc(e[field[0]])}</textarea>`:''}
   <div class="foot"><button class="btn" onclick="closeDlg()">Cancel</button><button class="btn p" id="esave">Save</button></div>`);
  if(field) $('#etpl').onclick = ev => { ev.preventDefault(); $('#eans').value = field[2]; };
  $('#esave').onclick = async () => { const b = {name:$('#ename').value, enabled:$('#eon').checked, mode:$('#emode').value}; if($('#eargs')) b.extra_args=$('#eargs').value; if(field) b[field[0]]=$('#eans').value; if($('#eanswer')) b.answer=$('#eanswer').value;
    await api(`/api/library/${id}/update`, b); closeDlg(); toast('Saved'); load(); };
}

function upload(url, file, barEl){ return new Promise((res, rej) => { const x = new XMLHttpRequest(); x.open('POST', url);
  x.upload.onprogress = e => { if(barEl) barEl.style.width = (100*e.loaded/e.total)+'%'; };
  x.onload = () => x.status<300?res():rej(new Error(x.responseText)); x.onerror = () => rej(new Error('upload failed')); x.send(file); }); }

/* ---------------------------------------------------------------- actions */
function bind(){
  if($('#pi_on')) $('#pi_on').onchange = e => { piDraft().enabled = e.target.checked; render(); };
  if($('#piadd')) $('#piadd').onchange = e => { if(e.target.value){ piDraft().packages = [...PID.packages.filter(id=>S.packages[id]), e.target.value]; render(); } };
  if($('#pi_script')) $('#pi_script').oninput = e => { const was = !!PID; piDraft().script = e.target.value; if(!was) { const b=document.querySelector('[data-act=pisave]'); if(b) b.textContent='💾 Save changes'; } };
  document.querySelectorAll('[data-w]').forEach(el=>el.onchange=()=>{ const D=wpDraft(), k=el.dataset.w;
    D[k] = el.type==='checkbox' ? el.checked : el.type==='number' ? (+el.value||1) : el.value;
    if(k==='language'){ const kb = S.win_options.languages[el.value]?.[1]; if(kb) D.keyboard = kb; } render(); });
  document.querySelectorAll('[data-a]').forEach(el=>el.onchange=()=>{ const [i,k]=el.dataset.a.split(':'), r=wpDraft().accounts[+i];
    r[k] = el.type==='checkbox' ? el.checked : k==='count' ? Math.max(1,+el.value||1) : el.value; render(); });
  document.querySelectorAll('input[name=wkey]').forEach(el=>el.onchange=()=>{ const D=wpDraft();
    D.edition = el.value==='generic' ? (['pro','home','education'].includes(D.edition)?D.edition:'pro') : el.value; render(); });
  document.querySelectorAll('input[name=wpc]').forEach(el=>el.onchange=()=>{ wpDraft().computer_names = el.value; render(); });
  if($('#isomode')) $('#isomode').onchange = async e => { await api('/api/settings',{iso_mode:e.target.value}); toast(e.target.value==='mount'?'New ISOs will be mounted':'New ISOs will be extracted'); load(); };
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(b.dataset.copy));
  document.querySelectorAll('[data-ostab]').forEach(b=>b.onclick=()=>{ osTab=b.dataset.ostab; render(); });
  document.querySelectorAll('[data-gen]').forEach(b=>b.onclick=()=>{ GEN.type=b.dataset.gen; GEN.id = GEN.type==='switch' ? Object.keys(PRESETS)[1] : ''; render(); });
  const gid = $('#gid'); if(gid){ const upd = () => { GEN.id = gid.value; ['silent','accept','machine','peruser'].forEach(k=>{ const c=$('#g'+k); if(c) GEN[k]=c.checked; }); if(GEN.peruser) GEN.machine=false;
      render(); const n=$('#gid'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } };
    gid.oninput = upd; gid.onchange = upd; ['silent','accept','machine','peruser'].forEach(k=>{ const c=$('#g'+k); if(c) c.onchange=upd; }); }
  const syncBulk = () => { const b=$('#bulk'); if(b){ b.style.display = SEL.size?'':'none'; $('#bulkn').textContent = SEL.size+' selected'; } };
  document.querySelectorAll('.sel').forEach(c=>c.onchange=()=>{ c.checked?SEL.add(c.dataset.key):SEL.delete(c.dataset.key); syncBulk(); });
  if($('#selall')) $('#selall').onchange = e => { document.querySelectorAll('.sel').forEach(c=>{ c.checked=e.target.checked; c.checked?SEL.add(c.dataset.key):SEL.delete(c.dataset.key); }); syncBulk(); };
  document.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault(); document.querySelector(`nav [data-v=${a.dataset.go}]`).click();});
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=async e=>{ e.preventDefault(); const d=b.dataset;
    try{ switch(d.act){
      case 'osw': return osWizard(d.mac ? [d.mac] : []);
      case 'sww': return swWizard(d.pkg, d.agent ? [d.agent] : []);
      case 'bulkos': { const macs = selMacs(); if(!macs.length) return toast('Selected PCs have no MAC (agent only)'); return osWizard(macs); }
      case 'bulksw': { const ids = selAgents(); if(!ids.length) return toast('None of the selected PCs runs the agent'); return swWizard(null, ids); }
      case 'bulkwol': { const macs = selMacs(); for(const m of macs) await api('/api/wol',{mac:m}); return toast(`Wake-on-LAN sent to ${macs.length} PC(s)`); }
      case 'bulkclear': SEL.clear(); return render();
      case 'rmpc': case 'bulkrm': {
          const keys = d.act==='rmpc' ? [d.key] : [...SEL];
          const label = k => k[0]==='m' ? (S.machines[k.slice(2)]?.name || k.slice(2)) : (S.agents[k.slice(2)]?.hostname || 'PC');
          const list = keys.map(label);
          const hasAgent = keys.some(k => k[0]==='a' || Object.values(S.agents).some(a=>a.macs.includes(k.slice(2))));
          if(!confirm(`Remove ${list.length>3 ? list.length+' computers' : list.join(', ')} from the list?\n\n`
             + `Its scheduled OS install and pending software are cancelled. Nothing is changed on the PC itself.`
             + (hasAgent ? `\n\nA PC whose agent is still installed comes back at its next report: uninstall the agent first (Install the agent page) to remove it for good.` : `\n\nIt comes back if it network-boots again.`))) return;
          const r = await api('/api/computers/remove', {macs: keys.filter(k=>k[0]==='m').map(k=>k.slice(2)), agents: keys.filter(k=>k[0]==='a').map(k=>k.slice(2))});
          keys.forEach(k=>SEL.delete(k)); toast(`${r.removed} computer(s) removed`); return load(); }
      case 'wuseall': for(const e of Object.values(S.library).filter(e=>e.boot?.type==='windows')) await api(`/api/library/${e.id}/update`,{answer:'profile'}); toast('All Windows ISOs use this page'); return load();
      case 'piup': case 'pidown': { const L = piDraft().packages.filter(id=>S.packages[id]), i=+d.i, j = d.act==='piup'?i-1:i+1;
          [L[i],L[j]]=[L[j],L[i]]; PID.packages = L; return render(); }
      case 'pirm': { const L = piDraft().packages.filter(id=>S.packages[id]); L.splice(+d.i,1); PID.packages = L; return render(); }
      case 'pitpl': { const D = piDraft(); D.script = (D.script ? D.script.trimEnd()+'\n\n' : '') + POST_TPL; return render(); }
      case 'pisave': { const r = await api('/api/postinstall', piDraft()); PID = null; await load();
          if(r.problems.length){ $('#piprob').innerHTML = `<div class="pill bad" style="margin-top:8px">⚠️ ${r.problems.map(esc).join(' · ')}</div>`; toast('Saved, but see the warning'); } else toast('Post-install saved'); return; }
      case 'wadd': wpDraft().accounts.push({prefix:'User', suffix:'number', count:1, admin:false, password:''}); return render();
      case 'wdel': wpDraft().accounts.splice(+d.i,1); return render();
      case 'wsave': { const r = await api('/api/winprofile', wpDraft()); WPD = null; await load();
          if(r.problems.length){ $('#wprob').innerHTML = `<div class="pill bad" style="margin-top:8px">⚠️ ${r.problems.map(esc).join(' · ')}</div>`; toast('Saved, but fix the problems shown'); } else toast('Windows setup saved'); return; }
      case 'wpreview': { const r = await api('/api/winprofile/preview', {profile: wpDraft()});
          return dlg(`<h3>Answer file for one PC</h3><p class="muted">Example generated from the current form${r.problems.length?` — <b style="color:var(--bad)">${r.problems.map(esc).join(' · ')}</b>`:''}.</p><pre style="max-height:60vh">${esc(r.xml)}</pre><div class="foot"><button class="btn p" onclick="closeDlg()">Close</button></div>`); }
      case 'addwdrv': { const inp = document.createElement('input'); inp.type='file'; inp.multiple = true; inp.accept='.inf,.sys,.cat,.dll';
          inp.onchange = async () => { for(const f of inp.files){ try{ await upload(`/api/upload?kind=winpedrv&name=${encodeURIComponent(f.name)}`, f); }catch(e){ toast(e.message); } }
            toast(`${inp.files.length} file(s) added`); load(); }; inp.click(); return; }
      case 'clrwdrv': if(confirm('Remove all Windows installer drivers?')){ await api('/api/winpe-drivers/clear',{}); load(); } return;
      case 'fetchtool': await api('/api/tools/fetch',{what:d.what}); toast('Downloading on the server…'); return load();
      case 'genpkg': { const cmd = genCommand(), id = GEN.id.trim();
          const r = await api('/api/packages',{name:id, os:GEN.type==='winget'?'windows':'linux', command:cmd, args:'', consent:true, run_as:GEN.type==='winget'&&GEN.peruser?'user':'system'});
          toast('Package created'); await load(); return pkgDialog(r.id); }
      case 'wol': await api('/api/wol',{mac:d.mac}); return toast('Wake-on-LAN packet sent');
      case 'unassign': await api('/api/assign',{mac:d.mac, entry_id:null}); toast('Cancelled'); return load();
      case 'rename': { const n = prompt('Name for this computer', S.machines[d.mac]?.name||''); if(n!==null){ await api('/api/machine',{mac:d.mac,name:n}); load(); } return; }
      case 'addpc': { const m = prompt('MAC address (aa:bb:cc:dd:ee:ff)'); if(m){ const n = prompt('Name (optional)')||''; await api('/api/machine',{mac:m,name:n}); load(); } return; }
      case 'rescan': { const r = await api('/api/library/scan',{}); toast(r.added.length ? `${r.added.length} ISO(s) to prepare` : 'Nothing new'); return load(); }
      case 'prep': await api(`/api/library/${d.id}/prepare`,{}); return load();
      case 'del': if(confirm('Remove from library? (extracted files are deleted)')){ await api(`/api/library/${d.id}/delete`,{delete_iso:confirm('Also delete the ISO file itself?')}); load(); } return;
      case 'edit': return editEntry(d.id);
      case 'newpkg': return pkgDialog(d.id);
      case 'delpkg': if(confirm('Delete package?')){ await api(`/api/packages/${d.id}/delete`,{}); load(); } return;
      case 'canceljob': await api(`/api/jobs/${d.id}/cancel`,{}); return load();
      case 'clearlog': await api('/api/events/clear',{}); return load();
      case 'smb': { const t = await (await fetch('/api/smbconf')).text(); return dlg(`<h3>SMB share for Windows installs</h3><p class="muted">WinPE maps this share and runs setup.exe from it.</p><pre>${esc(t)}</pre><div class="foot"><button class="btn p" onclick="closeDlg()">OK</button></div>`); }
      case 'agenthelp': return go('agent');
      case 'saveset': { const b={}; ['server_ip','http_port','default_action','menu_timeout','auto_delay','confirm_timeout','smb_share','smb_user','smb_pass','agent_token','admin_password'].forEach(k=>b[k]=$('#s_'+k).value);
        ['http_port','menu_timeout','auto_delay','confirm_timeout'].forEach(k=>b[k]=parseInt(b[k])||0); b.proxy_dhcp=$('#s_proxy_dhcp').checked; b.tftp=$('#s_tftp').checked;
        await api('/api/settings', b); toast('Saved'); return load(); }
    }}catch(err){ toast(err.message); } });
  const drop = $('#dropIso'); if(drop){ const inp = drop.querySelector('input'), bar = drop.querySelector('.bar');
    const send = async files => { for(const f of files){ bar.hidden=false; toast('Uploading '+f.name); try{ await upload(`/api/upload?kind=iso&name=${encodeURIComponent(f.name)}`, f, bar.firstElementChild); }catch(e){ toast(e.message); } } bar.hidden=true; load(); };
    drop.onclick = e => { if(e.target!==inp) inp.click(); }; inp.onchange = () => send(inp.files);
    drop.ondragover = e => { e.preventDefault(); drop.classList.add('hov'); }; drop.ondragleave = () => drop.classList.remove('hov');
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove('hov'); send(e.dataTransfer.files); }; }
}
